name: Sample project data

# Builds the small TCGA slices bundled with Kiri for the sample projects and
# commits them to the branch. Runs when the build script changes.
on:
  push:
    branches: [claude/project-thread-btcqwn]
    paths: ["backend/scripts/build_sample_slice.py", ".github/workflows/sample-data.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pandas>=2.2,<3"
      - name: Which hub files exist
        run: |
          for f in TCGA-COAD.star_tpm.tsv.gz TCGA-COAD.survival.tsv TCGA-COAD.clinical.tsv.gz gencode.v36.annotation.gtf.gene.probemap; do
            echo "$f $(curl -s -o /dev/null -w '%{http_code}' -I https://gdc-hub.s3.us-east-1.amazonaws.com/download/$f)"
          done
      - name: Build the slices
        run: python backend/scripts/build_sample_slice.py backend/app/cohorts/samples
      - name: Commit them
        run: |
          git config user.name "kiri-ci"; git config user.email "kiri-ci@users.noreply.github.com"
          git add backend/app/cohorts/samples
          git diff --cached --quiet && exit 0
          git commit -m "Sample project data: TCGA slices built by CI"
          git push
