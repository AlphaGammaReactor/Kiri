name: Sample project data

# Builds the small TCGA slices bundled with Kiri for the sample projects and
# commits them to the branch. Runs when the build script changes.
on:
  push:
    branches: [claude/project-thread-btcqwn]
    paths: ["backend/scripts/build_sample_slice.py", "backend/app/cohorts/**", ".github/workflows/sample-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "xenaPython==1.0.14"
      - name: Cohort pack files are reachable (what the app downloads)
        continue-on-error: true
        run: |
          for hub in https://gdc.xenahubs.net/download https://gdc-hub.s3.us-east-1.amazonaws.com/download; do
            for f in TCGA-COAD.star_tpm.tsv.gz TCGA-COAD.survival.tsv TCGA-COAD.clinical.tsv.gz gencode.v36.annotation.gtf.gene.probemap; do
              echo "$hub/$f -> $(curl -s -L -o /dev/null -r 0-99 -w '%{http_code} %{url_effective}' "$hub/$f")"
            done
          done
      - name: Build the slices
        run: python backend/scripts/build_sample_slice.py backend/app/cohorts/samples
      - name: Commit them
        run: |
          git config user.name "kiri-ci"; git config user.email "kiri-ci@users.noreply.github.com"
          git add backend/app/cohorts/samples
          git diff --cached --quiet && exit 0
          git commit -m "Sample project data: TCGA slices built by CI"
          git push

  pack:
    name: Full cohort download works (as the app does it)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the engine's packages
        working-directory: backend
        run: uv sync --frozen
      - name: Download TCGA-READ, convert it, run survival and expression on a gene not in the sample slice
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import time, tempfile
          from pathlib import Path
          from app.cohorts import packs
          from app.cohorts.store import cohort_for
          from app.analyses import survival, expression
          d = Path(tempfile.mkdtemp())
          t = time.time()
          packs.build_pack(d, "TCGA-READ", lambda k, a, b: None)
          print("downloaded and converted in", round(time.time() - t), "s;", (packs.pack_dir(d, "TCGA-READ") / "ready.json").read_text())
          c = cohort_for(["TCGA-READ"], ["EGFR"], d)
          r = survival.run(c, "EGFR")
          print("survival EGFR READ: n", r["groups"]["high"]["n"] + r["groups"]["low"]["n"], "HR", r["cox"]["hr"], "p", r["logrank"]["p"])
          e = expression.tumour_vs_normal(c, "EGFR")
          print("expression EGFR READ:", e.get("error") or (e["groups"][0]["n"], e["groups"][1]["n"], e["test"]["p"]))
          PY
